<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - Управление транзакциями</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .search-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .users-table {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        tbody tr:hover {
            background: #f9f9f9;
        }

        .discount-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
            display: inline-block;
        }

        .action-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            margin-bottom: 25px;
        }

        .modal-header h2 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .success-message, .error-message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .success-message.show, .error-message.show {
            display: block;
        }

        .user-details {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .user-details p {
            margin: 8px 0;
            color: #666;
        }

        .user-details strong {
            color: #333;
        }

        .transactions-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .transaction-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #e0e0e0;
        }

        .transaction-item p {
            margin: 5px 0;
            font-size: 14px;
        }

        .qr-section {
            text-align: center;
        }

        .qr-code {
            max-width: 300px;
            margin: 20px auto;
        }

        .qr-code img {
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Админ-панель</h1>
            <p>Управление программой лояльности</p>
        </div>

        <div class="cards">
            <div class="card">
                <h3>📊 Статистика</h3>
                <p>Всего пользователей: <strong id="totalUsers">0</strong></p>
            </div>

            <div class="card qr-section">
                <h3>📱 QR-код регистрации</h3>
                <div class="qr-code">
                    <img id="qrCodeImage" src="" alt="QR код">
                </div>
                <p style="color: #666; font-size: 14px;">Отсканируйте для регистрации</p>
            </div>
        </div>

        <div class="search-section">
            <h3 style="margin-bottom: 15px; color: #667eea;">🔍 Поиск пользователя</h3>
            <input type="text" id="searchInput" class="search-input" placeholder="Поиск по имени, email или номеру телефона...">
        </div>

        <div class="users-table">
            <table>
                <thead>
                    <tr>
                        <th>Имя</th>
                        <th>Email</th>
                        <th>Телефон</th>
                        <th>Потрачено</th>
                        <th>Скидка</th>
                        <th>Номер карты</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr>
                        <td colspan="7" style="text-align: center; color: #999; padding: 40px;">
                            Загрузка пользователей...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Модальное окно для добавления транзакции -->
    <div class="modal" id="transactionModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>💳 Добавить покупку</h2>
            </div>

            <div class="success-message" id="successMessage"></div>
            <div class="error-message" id="errorMessage"></div>

            <div class="user-details" id="userDetails"></div>

            <form id="transactionForm">
                <div class="form-group">
                    <label for="amount">Сумма покупки (₽)</label>
                    <input type="number" id="amount" name="amount" step="0.01" min="0" required>
                </div>

                <div class="form-group">
                    <label for="description">Описание (необязательно)</label>
                    <textarea id="description" name="description" rows="3" placeholder="Например: Заказ №123"></textarea>
                </div>

                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                    <button type="submit" class="btn btn-primary">Добавить</button>
                </div>
            </form>

            <div id="transactionsHistory" style="margin-top: 30px; display: none;">
                <h3 style="color: #667eea; margin-bottom: 15px;">История покупок</h3>
                <div class="transactions-list" id="transactionsList"></div>
            </div>
        </div>
    </div>

    <script>
        let allUsers = [];
        let currentUserId = null;

        // Загрузка пользователей при старте
        loadUsers();
        loadQRCode();

        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                allUsers = await response.json();

                document.getElementById('totalUsers').textContent = allUsers.length;
                renderUsers(allUsers);
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        async function loadQRCode() {
            try {
                const response = await fetch('/api/qr/registration');
                const data = await response.json();
                document.getElementById('qrCodeImage').src = data.qrCode;
            } catch (error) {
                console.error('Error loading QR code:', error);
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('usersTableBody');

            if (users.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; color: #999; padding: 40px;">
                            Пользователи не найдены
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = users.map(user => `
                <tr>
                    <td>${user.first_name} ${user.last_name}</td>
                    <td>${user.email}</td>
                    <td>${user.phone}</td>
                    <td>${user.total_spent.toLocaleString('ru-RU')} ₽</td>
                    <td><span class="discount-badge">${user.discount_percent}%</span></td>
                    <td style="font-family: monospace;">${user.pass_serial}</td>
                    <td>
                        <button class="action-btn" onclick="openTransactionModal('${user.id}')">
                            Добавить покупку
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Поиск пользователей
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();

            const filteredUsers = allUsers.filter(user =>
                user.first_name.toLowerCase().includes(searchTerm) ||
                user.last_name.toLowerCase().includes(searchTerm) ||
                user.email.toLowerCase().includes(searchTerm) ||
                user.phone.includes(searchTerm) ||
                user.pass_serial.toLowerCase().includes(searchTerm)
            );

            renderUsers(filteredUsers);
        });

        async function openTransactionModal(userId) {
            currentUserId = userId;

            try {
                const response = await fetch(`/api/user/${userId}`);
                const user = await response.json();

                document.getElementById('userDetails').innerHTML = `
                    <p><strong>Клиент:</strong> ${user.first_name} ${user.last_name}</p>
                    <p><strong>Email:</strong> ${user.email}</p>
                    <p><strong>Текущая скидка:</strong> ${user.discount_percent}%</p>
                    <p><strong>Потрачено всего:</strong> ${user.total_spent.toLocaleString('ru-RU')} ₽</p>
                `;

                // Загружаем историю транзакций
                const transResponse = await fetch(`/api/transactions/${userId}`);
                const transactions = await transResponse.json();

                if (transactions.length > 0) {
                    document.getElementById('transactionsHistory').style.display = 'block';
                    document.getElementById('transactionsList').innerHTML = transactions.map(t => `
                        <div class="transaction-item">
                            <p><strong>Сумма:</strong> ${t.amount.toLocaleString('ru-RU')} ₽</p>
                            <p><strong>Скидка:</strong> ${t.discount_applied.toLocaleString('ru-RU')} ₽</p>
                            ${t.description ? `<p><strong>Описание:</strong> ${t.description}</p>` : ''}
                            <p style="color: #999; font-size: 12px;">${new Date(t.created_at).toLocaleString('ru-RU')}</p>
                        </div>
                    `).join('');
                } else {
                    document.getElementById('transactionsHistory').style.display = 'none';
                }

                document.getElementById('transactionModal').classList.add('show');
            } catch (error) {
                console.error('Error opening modal:', error);
            }
        }

        function closeModal() {
            document.getElementById('transactionModal').classList.remove('show');
            document.getElementById('transactionForm').reset();
            document.getElementById('successMessage').classList.remove('show');
            document.getElementById('errorMessage').classList.remove('show');
            currentUserId = null;
        }

        document.getElementById('transactionForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const amount = parseFloat(document.getElementById('amount').value);
            const description = document.getElementById('description').value;

            try {
                const response = await fetch('/api/transaction', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user_id: currentUserId,
                        amount: amount,
                        description: description
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка при добавлении транзакции');
                }

                const successMsg = document.getElementById('successMessage');
                successMsg.textContent = `✅ Покупка добавлена! Применена скидка: ${data.transaction.discountApplied.toLocaleString('ru-RU')} ₽`;
                successMsg.classList.add('show');

                // Обновляем список пользователей
                await loadUsers();

                // Обновляем модальное окно
                setTimeout(() => {
                    openTransactionModal(currentUserId);
                }, 2000);

            } catch (error) {
                const errorMsg = document.getElementById('errorMessage');
                errorMsg.textContent = error.message;
                errorMsg.classList.add('show');
            }
        });

        // Закрытие модального окна по клику вне его
        document.getElementById('transactionModal').addEventListener('click', (e) => {
            if (e.target.id === 'transactionModal') {
                closeModal();
            }
        });
    </script>
</body>
</html>
